    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var desc =
            Object.getOwnPropertyDescriptor(window, "fetch") ||
            Object.getOwnPropertyDescriptor(Window.prototype, "fetch");
          if (desc && desc.configurable && !desc.set && currentFetch) {
            Object.defineProperty(window, "fetch", {
              configurable: true,
              enumerable: true,
              get: function () {
                return currentFetch;
              },
              set: function (fn) {
                if (typeof fn === "function") currentFetch = fn;
              },
            });
          }
        } catch (_) {}
        window.addEventListener(
          "error",
          function (event) {
            var msg = String((event && event.message) || "");
            var file = String((event && event.filename) || "");
            if (
              file.indexOf("chrome-extension://") === 0 ||
              file.indexOf("moz-extension://") === 0 ||
              msg.indexOf("Cannot set property fetch") !== -1
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
            }
          },
          true
        );
      })();
    </script>
